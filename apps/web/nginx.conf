server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Public resolver — Railway has no Docker DNS at 127.0.0.11
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    location /v1/ {
        # Same-origin proxy direto pro domínio NATIVO do Railway (sem o Cloudflare
        # no meio) — proxiar via api.limoapp.com.br fazia a chamada server-side do
        # nginx (IP de datacenter) ser bloqueada com 403 pelo Cloudflare.
        proxy_pass https://limoapi-production.up.railway.app/v1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_set_header Host limoapi-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html (and the SPA fallback) must never be cached, or the browser
        # keeps loading an old build that points at a stale JS bundle. The hashed
        # assets below stay immutable, so only this tiny HTML revalidates.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
